name: Tests

on:
  # Feature branches with an open PR should not run the same suite twice.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m py_compile server.py
      - run: python -m pytest -q tests/test_api.py
      - run: python -m pytest -q tests/test_preview_isolation.py
      - run: python -m pytest -q tests/test_product_metadata.py tests/test_product_sources.py

  frontend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check public/app.js
      - run: node --check public/santa-ui.js
      - run: node --check public/preview-store.js
      - run: node --check tools/perf-browser.js
      - run: node --check tools/release-smoke.mjs
      - run: node --check tools/ru-network-probe.mjs

  public-release-smoke:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/supabase-mvp'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check live public site without credentials
        run: node tools/release-smoke.mjs

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: shursh_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shursh_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      SHURSH_DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/shursh_ci
      SHURSH_RATE_SECRET: ci-only-rate-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m compileall -q app.py cloud server.py tests/test_cloud.py
      - name: PostgreSQL integration + reproducible authenticated API timings
        run: python -m pytest -q -s tests/test_cloud.py -m "not browser and not fontperf"

  browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: shursh_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shursh_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      SHURSH_DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/shursh_ci
      SHURSH_RATE_SECRET: ci-only-rate-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Browser E2E + font loading measurements
        run: python -m pytest -q -s tests/test_cloud.py -m browser
  pr4-ui-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: shursh_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shursh_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      SHURSH_DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/shursh_ci
      SHURSH_RATE_SECRET: ci-only-rate-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt -r tools/requirements-ui.txt playwright==1.56.0
      - name: UI source rule registry is synchronized
        run: python tools/ui_audit.py --check
      - name: CSS cascade winners unchanged after refactor
        run: python tools/css_effective_check.py --check
      - run: python -m playwright install --with-deps chromium webkit
      - name: Six tabs DOM/HTTP/viewport acceptance
        run: python -m pytest -q -s tests/test_pr4_acceptance.py -m browser
      - name: Upload sanitized PR4 browser acceptance screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr4-six-tab-ui-acceptance
          path: artifacts/pr4-ui/
          if-no-files-found: warn
          retention-days: 7
