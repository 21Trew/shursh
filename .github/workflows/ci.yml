name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m py_compile server.py
      - run: python -m pytest -q tests/test_api.py

  frontend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check public/app.js
      - run: node --check public/preview-store.js

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: shursh_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shursh_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      SHURSH_DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/shursh_ci
      SHURSH_RATE_SECRET: ci-only-rate-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m compileall -q app.py cloud server.py tests/test_cloud.py
      - run: python -m pytest -q tests/test_cloud.py -m "not browser"

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: shursh_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shursh_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      SHURSH_DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/shursh_ci
      SHURSH_RATE_SECRET: ci-only-rate-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Browser E2E (Flask + PostgreSQL + mocked Supabase Auth)
        run: python -m pytest -q tests/test_cloud.py -m browser
