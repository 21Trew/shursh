name: Tests

on:
  # Feature branches with an open PR should not run the same suite twice.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m py_compile server.py
      - run: python -m pytest -q tests/test_api.py
      - run: python -m pytest -q tests/test_preview_isolation.py
      - run: python -m pytest -q tests/test_ru_pilot_preflight.py
      - run: python -m pytest -q tests/test_product_metadata.py tests/test_product_sources.py

  frontend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check public/app.js
      - run: node --check public/santa-ui.js
      - run: node --check public/preview-store.js
      - run: node --check tools/perf-browser.js
      - run: node --check tools/release-smoke.mjs
      - run: node --check tools/ru-network-probe.mjs

  public-release-smoke:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/supabase-mvp'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check live public site without credentials
        run: node tools/release-smoke.mjs

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: shursh_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shursh_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      SHURSH_DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/shursh_ci
      SHURSH_RATE_SECRET: ci-only-rate-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m compileall -q app.py cloud server.py tests/test_cloud.py
      - name: PostgreSQL integration + reproducible authenticated API timings
        run: python -m pytest -q -s tests/test_cloud.py -m "not browser and not fontperf"

  browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: shursh_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shursh_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      SHURSH_DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/shursh_ci
      SHURSH_RATE_SECRET: ci-only-rate-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Browser E2E + font loading measurements
        run: python -m pytest -q -s tests/test_cloud.py -m browser
  pr4-ui-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: shursh_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shursh_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      SHURSH_DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/shursh_ci
      SHURSH_RATE_SECRET: ci-only-rate-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt -r tools/requirements-ui.txt playwright==1.56.0
      - name: UI source rule registry is synchronized
        run: python tools/ui_audit.py --check
      - name: CSS cascade winners unchanged after refactor
        run: python tools/css_effective_check.py --check
      - run: python -m playwright install --with-deps chromium webkit
      - name: Six tabs DOM/HTTP/viewport acceptance
        run: python -m pytest -q -s tests/test_pr4_acceptance.py -m browser
      - name: Upload sanitized PR4 browser acceptance screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr4-six-tab-ui-acceptance
          path: artifacts/pr4-ui/
          if-no-files-found: warn
          retention-days: 7

  ru-pilot-container:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/ru-app-platform-pilot-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the exact Timeweb Dockerfile
        run: docker build --tag shursh-ru-pilot:ci .
      - name: Confirm container rejects missing Staging credentials
        run: |
          if docker run --rm shursh-ru-pilot:ci; then
            echo "Pilot container unexpectedly accepted an empty environment"
            exit 1
          fi
      - name: Anonymous HTTP smoke with synthetic CI-only Staging-shaped variables
        run: |
          docker run --rm -d --name shursh-pilot-ci -p 127.0.0.1:8789:8080 \
            -e 'SHURSH_DATABASE_URL=postgresql://shursh_preview_login.vwhzhbsaspbelkvnjjho:fake-ci-password@aws-0-eu-central-1.pooler.supabase.com:6543/postgres?sslmode=require' \
            -e 'SUPABASE_URL=https://vwhzhbsaspbelkvnjjho.supabase.co' \
            -e 'SUPABASE_PUBLISHABLE_KEY=sb_publishable_fake_for_ci' \
            -e 'SHURSH_RATE_SECRET=ci-only-staging-shape-secret-never-real' \
            shursh-ru-pilot:ci
          trap 'docker rm -f shursh-pilot-ci >/dev/null 2>&1 || true' EXIT
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request
          base='http://127.0.0.1:8789'
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(base+'/',timeout=2) as r:
                      if r.status==200:
                          break
              except (OSError,urllib.error.URLError):
                  time.sleep(1)
          else:
              raise SystemExit('Pilot container did not start')
          for path in ('/','/app.js','/styles.css','/fonts.css',
                       '/fonts/onest-cyrillic-wght-normal.woff2',
                       '/api/me','/api/dashboard'):
              with urllib.request.urlopen(base+path,timeout=5) as r:
                  assert r.status==200,(path,r.status)
                  data=r.read()
                  assert data,(path,'empty response')
                  if path=='/api/me':
                      payload=json.loads(data)
                      assert payload['user'] is None and payload['demo'] is False
                  if path=='/api/dashboard':
                      payload=json.loads(data)
                      assert payload['user'] is None
                      assert not payload['lists'] and not payload['events']
          print('RU pilot container: anonymous HTTP smoke passed')
          PY
