name: Experimental rate limiter benchmark
on:
  push:
    branches: [experiment/rate-limit-roundtrips-20261127]
permissions:
  contents: read
jobs:
  rate-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-bench-only
          POSTGRES_DB: shursh_rate_bench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shursh_rate_bench"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      SHURSH_BENCH_DISPOSABLE: 'yes'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Start isolated Supavisor transaction pooler
        run: |
          python -m py_compile tools/rate_limit_pooler_experiment.py
          bash -n tools/start_rate_bench_pooler.sh
          python -m tools.rate_limit_pooler_experiment --setup
          bash tools/start_rate_bench_pooler.sh
          python -m tools.rate_limit_pooler_experiment --ready
      - name: Supavisor benchmark and fault gates
        run: python -m tools.rate_limit_pooler_experiment --profile local --output artifacts/rate-pooler/local.json
      - name: Optional loopback latency profile
        run: |
          if sudo tc qdisc add dev lo root netem delay 5ms; then
            trap 'sudo tc qdisc del dev lo root' EXIT
            python -m tools.rate_limit_pooler_experiment --profile netem --output artifacts/rate-pooler/netem.json
          else
            echo '{"status":"skipped","reason":"netem unavailable"}' > artifacts/rate-pooler/netem-status.json
          fi
      - name: Stop disposable pooler and show startup diagnostics on failure
        if: always()
        run: |
          if docker inspect shursh-bench-pooler >/dev/null 2>&1; then
            docker logs --tail 80 shursh-bench-pooler || true
            docker rm -f shursh-bench-pooler
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-supavisor-benchmark
          path: artifacts/rate-pooler/
          if-no-files-found: warn
          retention-days: 7
